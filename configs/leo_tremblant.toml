# Real archived OMM geometry, assumed access/backhaul capacities and handshakes.
[communication]
profile = "physical"
mission_route = "cloud"
stale_information = ["task", "intentions", "priorities"]
seconds_per_step = 1.0
leo_timeline = "data/leo/tremblant_6h.npz"
