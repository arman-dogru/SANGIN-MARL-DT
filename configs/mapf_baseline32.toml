# Single-stage baseline: 32 agents from scratch, long epsilon decay. Same maps/pairing/learner as the curriculum.
protocol = "panama_mapf_curriculum_v1"
populations = [32]
map_size = [32, 64]
density = [0.10, 0.30]
pair_distance = [4, 40]
episodes_per_stage = 50000       # effectively unbounded; wall-limited
validation_interval_episodes = 500
validation_episodes = 200
graduation_success_rate = 0.95
advance_on_cap = true
epsilon_reset_per_stage = true
reset_replay_on_graduation = true
train_maps = 2000
validation_maps = 100
seed = 42
learning_rate = 0.001
gamma = 0.90
epsilon_start = 1.0
epsilon_end = 0.1
epsilon_decay_steps = 60000      # 3x the per-stage decay; ~200k joint steps fit in 2 sessions
replay_capacity = 300000
batch_size = 64
torch_threads = 2
session_wall_seconds = 37800     # 10.5 h: below the runner's 11 h guard minus setup (runner SIGKILLs at its guard)
