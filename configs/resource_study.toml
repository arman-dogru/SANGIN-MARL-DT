# Explicit simulation assumptions; no measured equipment or calibrated task claim.
[communication]
profile = "physical"
mission_route = "cloud"
stale_information = ["task", "intentions", "priorities"]
seconds_per_step = 1.0
access_uplink_mbps = 50.0
access_downlink_mbps = 50.0
satellite_uplink_mbps = 10.0
satellite_downlink_mbps = 50.0
one_way_propagation_seconds = 0.025
handover_enabled = false
contention_enabled = false
packet_payload_bytes = 65536
packet_overhead_bytes = 48

[resource_allocation]
enabled = true
task_input_bits = 100000
cycles_per_bit = 1000.0
drone_cycles_per_second = 1e9
cloud_cycles_per_second = 1e10
robot_power_w = 0.2
drone_power_w = 2.0
weight_min = 1.0
weight_max = 4.0
policy = "priority"
energy_coefficient = 1.0
latency_coefficient = 1.0
decision_budget_seconds = 0.1
age_reference_seconds = 1.0
terminal_eirp_dbw = 35.0
assumed_satellite_distance_km = 550.0
assumed_gateway_distance_km = 550.0
assumed_atmosphere_db = 3.0
