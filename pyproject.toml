[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "panama-uav"
version = "0.2.0"
description = "UAV-PANAMA communication staleness and online learning transport study"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "scipy>=1.13",
  "torch>=2.4",
  "matplotlib>=3.8",
  "tqdm>=4.66",
  "simpy==4.1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
optimization = ["cvxpy>=1.6,<2", "clarabel>=0.10,<1"]
visualization = ["pygame-ce>=2.5"]
leo = ["sgp4==2.27", "skyfield==1.55", "itur==0.4.0", "psutil>=7.0"]

[project.scripts]
panama-uav = "panama_uav.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]
